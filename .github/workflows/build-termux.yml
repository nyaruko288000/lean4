name: Lean4 Cross (ThinLTO + Zig 0.15.2)

on:
  workflow_dispatch:
    inputs:
      version:
        default: 'v4.27.0'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZIG_DIR: /opt/zig
      LEAN_HOST_DIR: /opt/lean-host
      WRAPPER_DIR: /opt/cc-wrapper
      
    steps:
      - name: Install host Lean4 via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:${{ inputs.version }}
          
          # 复制到固定位置避免路径问题
          cp -r $HOME/.elan/toolchains/leanprover--lean4---${{ inputs.version }} ${{ env.LEAN_HOST_DIR }}
          
      - name: Verify host lean
        run: ${{ env.LEAN_HOST_DIR }}/bin/lean --version

      - name: Install Zig 0.15.2
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xf zig-x86_64-linux-0.15.2.tar.xz
          sudo mv zig-x86_64-linux-0.15.2 ${{ env.ZIG_DIR }}

      - name: Setup Zig CC wrappers
        run: |
          sudo mkdir -p ${{ env.WRAPPER_DIR }}
          
          sudo tee ${{ env.WRAPPER_DIR }}/aarch64-linux-musl-clang << 'EOF'
          #!/bin/sh
          exec /opt/zig/zig cc -target aarch64-linux-musl "$@"
          EOF
          
          sudo tee ${{ env.WRAPPER_DIR }}/aarch64-linux-musl-clang++ << 'EOF'
          #!/bin/sh
          exec /opt/zig/zig c++ -target aarch64-linux-musl "$@"
          EOF
          
          sudo tee ${{ env.WRAPPER_DIR }}/zig-ar << 'EOF'
          #!/bin/sh
          exec /opt/zig/zig ar "$@"
          EOF
          
          sudo tee ${{ env.WRAPPER_DIR }}/zig-ranlib << 'EOF'
          #!/bin/sh
          exec /opt/zig/zig ranlib "$@"
          EOF
          
          sudo chmod +x ${{ env.WRAPPER_DIR }}/*

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Clone Lean4
        run: |
          git clone --depth 1 --branch ${{ inputs.version }} --recurse-submodules \
            https://github.com/leanprover/lean4.git

      - name: Configure
        working-directory: lean4
        run: |
          mkdir build && cd build
          
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=${{ env.WRAPPER_DIR }}/aarch64-linux-musl-clang \
            -DCMAKE_CXX_COMPILER=${{ env.WRAPPER_DIR }}/aarch64-linux-musl-clang++ \
            -DCMAKE_AR=${{ env.WRAPPER_DIR }}/zig-ar \
            -DCMAKE_RANLIB=${{ env.WRAPPER_DIR }}/zig-ranlib \
            -DLEAN_STAGE0=${{ env.LEAN_HOST_DIR }} \
            -DCMAKE_C_FLAGS="-march=armv8.5-a+crypto+sha3+sm4+i8mm+bf16 -mtune=cortex_a78 -O3 -flto=thin -ffunction-sections -fdata-sections -fno-semantic-interposition" \
            -DCMAKE_CXX_FLAGS="-march=armv8.5-a+crypto+sha3+sm4+i8mm+bf16 -mtune=cortex_a78 -O3 -flto=thin -ffunction-sections -fdata-sections -fno-semantic-interposition" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -flto=thin -Wl,--gc-sections -Wl,-O2 -Wl,-s" \
            -DLEAN_STATIC=ON

      - name: Build
        working-directory: lean4/build
        run: ninja -j$(nproc)

      - name: Package
        run: |
          cd lean4/build
          DESTDIR=$PWD/out ninja install
          cd out/usr/local
          file bin/lean
          tar --zstd -cf $GITHUB_WORKSPACE/lean4-aarch64-musl-thinlto.tar.zst .

      - uses: actions/upload-artifact@v4
        with:
          name: lean4-aarch64-musl-thinlto
          path: lean4-aarch64-musl-thinlto.tar.zst
