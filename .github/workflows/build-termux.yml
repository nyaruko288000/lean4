name: Lean4 Cross (ThinLTO + Zig 0.15.2)

on:
  workflow_dispatch:
    inputs:
      version:
        default: 'v4.15.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install host Lean4
        run: |
          curl -sSL https://github.com/leanprover/lean4/releases/download/${{ inputs.version }}/lean-${{ inputs.version }}-linux.tar.zst \
            | tar --zstd -xf - -C /tmp
          sudo mv /tmp/lean-${{ inputs.version }}-linux /opt/lean-host
          echo "/opt/lean-host/bin" >> $GITHUB_PATH

      - name: Install Zig 0.15.2
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-linux-x86_64-0.15.2.tar.xz
          tar xf zig-linux-x86_64-0.15.2.tar.xz
          sudo mv zig-linux-x86_64-0.15.2 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Setup Zig CC wrappers
        run: |
          mkdir -p ~/.local/bin
          
          cat > ~/.local/bin/aarch64-linux-musl-clang << 'EOF'
          #!/bin/sh
          exec zig cc -target aarch64-linux-musl "$@"
          EOF
          
          cat > ~/.local/bin/aarch64-linux-musl-clang++ << 'EOF'
          #!/bin/sh
          exec zig c++ -target aarch64-linux-musl "$@"
          EOF
          
          cat > ~/.local/bin/zig-ar << 'EOF'
          #!/bin/sh
          exec zig ar "$@"
          EOF
          
          cat > ~/.local/bin/zig-ranlib << 'EOF'
          #!/bin/sh
          exec zig ranlib "$@"
          EOF
          
          chmod +x ~/.local/bin/*
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Clone Lean4
        run: |
          git clone --depth 1 --branch ${{ inputs.version }} --recurse-submodules \
            https://github.com/leanprover/lean4.git

      - name: Configure
        working-directory: lean4
        run: |
          mkdir build && cd build
          
          CFLAGS="-march=armv8.5-a+crypto+sha3+sm4+i8mm+bf16 \
                  -mtune=cortex-a78 \
                  -O3 \
                  -flto=thin \
                  -ffunction-sections \
                  -fdata-sections \
                  -fno-semantic-interposition"
          
          LDFLAGS="-static \
                   -flto=thin \
                   -Wl,--gc-sections \
                   -Wl,--icf=safe \
                   -Wl,-O2 \
                   -Wl,--strip-all"
          
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=$HOME/.local/bin/aarch64-linux-musl-clang \
            -DCMAKE_CXX_COMPILER=$HOME/.local/bin/aarch64-linux-musl-clang++ \
            -DCMAKE_AR=$HOME/.local/bin/zig-ar \
            -DCMAKE_RANLIB=$HOME/.local/bin/zig-ranlib \
            -DLEAN_STAGE0=/opt/lean-host \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DLEAN_STATIC=ON

      - name: Build
        working-directory: lean4/build
        run: ninja -j$(nproc)

      - name: Package
        run: |
          cd lean4/build
          DESTDIR=$PWD/out ninja install
          cd out/usr/local
          file bin/lean
          tar --zstd -cf $GITHUB_WORKSPACE/lean4-aarch64-musl-thinlto.tar.zst .

      - uses: actions/upload-artifact@v4
        with:
          name: lean4-aarch64-musl-thinlto
          path: lean4-aarch64-musl-thinlto.tar.zst
