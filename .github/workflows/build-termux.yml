name: Lean4 Cross (ThinLTO)

on:
  workflow_dispatch:
    inputs:
      version:
        default: 'v4.27.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zig

      - name: Install host Lean4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:${{ inputs.version }}
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify
        run: |
          lean --version
          zig version

      - name: Setup Zig CC wrappers
        run: |
          mkdir -p ~/.local/bin
          
          echo '#!/bin/sh
          exec zig cc -target aarch64-linux-musl "$@"' > ~/.local/bin/zcc
          
          echo '#!/bin/sh
          exec zig c++ -target aarch64-linux-musl "$@"' > ~/.local/bin/zxx
          
          echo '#!/bin/sh
          exec zig ar "$@"' > ~/.local/bin/zar
          
          echo '#!/bin/sh
          exec zig ranlib "$@"' > ~/.local/bin/zranlib
          
          chmod +x ~/.local/bin/*
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone Lean4
        run: |
          git clone --depth 1 --branch ${{ inputs.version }} --recurse-submodules \
            https://github.com/leanprover/lean4.git

      - name: Configure
        working-directory: lean4
        run: |
          mkdir build && cd build
          
          CFLAGS="-march=armv8.5-a+crypto+sha3+sm4 -O3 -flto=thin -ffunction-sections -fdata-sections"
          LDFLAGS="-static -flto=thin -Wl,--gc-sections -Wl,--icf=safe -Wl,-O2 -Wl,--strip-all"
          
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=$HOME/.local/bin/zcc \
            -DCMAKE_CXX_COMPILER=$HOME/.local/bin/zxx \
            -DCMAKE_AR=$HOME/.local/bin/zar \
            -DCMAKE_RANLIB=$HOME/.local/bin/zranlib \
            -DLEAN_STAGE0=$HOME/.elan/toolchains/leanprover--lean4---${{ inputs.version }} \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DLEAN_STATIC=ON

      - name: Build
        working-directory: lean4/build
        run: ninja -j$(nproc)

      - name: Package
        run: |
          cd lean4/build
          DESTDIR=$PWD/out ninja install
          cd out/usr/local
          file bin/lean
          tar --zstd -cf $GITHUB_WORKSPACE/lean4-aarch64-musl.tar.zst .

      - uses: actions/upload-artifact@v4
        with:
          name: lean4-aarch64-musl
          path: lean4-aarch64-musl.tar.zst
