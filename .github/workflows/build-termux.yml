name: Lean4 Cross (ThinLTO + Zig 0.15.2)

on:
  workflow_dispatch:
    inputs:
      version:
        default: 'v4.27.0'

jobs:
  build:
    runs-on: ubuntu-latest
      
    steps:
      - name: Install host Lean4
        run: |
          VERSION="${{ inputs.version }}"
          curl -sSL "https://releases.lean-lang.org/lean4/${VERSION}/lean-${VERSION#v}-linux.tar.zst" \
            | tar --zstd -xf - -C /tmp
          sudo mv /tmp/lean-${VERSION#v}-linux /opt/lean-host
          
      - name: Verify host lean
        run: /opt/lean-host/bin/lean --version

      - name: Install Zig 0.15.2
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xf zig-x86_64-linux-0.15.2.tar.xz
          sudo mv zig-x86_64-linux-0.15.2 /opt/zig

      - name: Setup Zig CC wrappers
        run: |
          sudo mkdir -p /opt/cc-wrapper
          
          sudo tee /opt/cc-wrapper/aarch64-linux-musl-clang << 'EOF'
          #!/bin/sh
          exec /opt/zig/zig cc -target aarch64-linux-musl "$@"
          EOF
          
          sudo tee /opt/cc-wrapper/aarch64-linux-musl-clang++ << 'EOF'
          #!/bin/sh
          exec /opt/zig/zig c++ -target aarch64-linux-musl "$@"
          EOF
          
          sudo tee /opt/cc-wrapper/zig-ar << 'EOF'
          #!/bin/sh
          exec /opt/zig/zig ar "$@"
          EOF
          
          sudo tee /opt/cc-wrapper/zig-ranlib << 'EOF'
          #!/bin/sh
          exec /opt/zig/zig ranlib "$@"
          EOF
          
          sudo chmod +x /opt/cc-wrapper/*

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Clone Lean4
        run: |
          git clone --depth 1 --branch ${{ inputs.version }} --recurse-submodules \
            https://github.com/leanprover/lean4.git

      - name: Write toolchain file
        run: |
          cat > /tmp/toolchain.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER /opt/cc-wrapper/aarch64-linux-musl-clang)
          set(CMAKE_CXX_COMPILER /opt/cc-wrapper/aarch64-linux-musl-clang++)
          set(CMAKE_AR /opt/cc-wrapper/zig-ar)
          set(CMAKE_RANLIB /opt/cc-wrapper/zig-ranlib)
          set(CMAKE_C_FLAGS_INIT "-march=armv8.5-a+crypto+sha3+sm4+i8mm+bf16 -mtune=cortex_a78 -O3 -flto=thin -ffunction-sections -fdata-sections")
          set(CMAKE_CXX_FLAGS_INIT "-march=armv8.5-a+crypto+sha3+sm4+i8mm+bf16 -mtune=cortex_a78 -O3 -flto=thin -ffunction-sections -fdata-sections")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static -flto=thin -Wl,--gc-sections -Wl,-O2 -Wl,-s")
          EOF

      - name: Configure
        working-directory: lean4
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/toolchain.cmake \
            -DLEAN_STAGE0=/opt/lean-host \
            -DLEAN_STATIC=ON

      - name: Build
        working-directory: lean4/build
        run: make -j$(nproc)

      - name: Package
        run: |
          cd lean4/build
          DESTDIR=$PWD/out make install
          cd out/usr/local
          file bin/lean
          tar --zstd -cf $GITHUB_WORKSPACE/lean4-aarch64-musl-thinlto.tar.zst .

      - uses: actions/upload-artifact@v4
        with:
          name: lean4-aarch64-musl-thinlto
          path: lean4-aarch64-musl-thinlto.tar.zst
